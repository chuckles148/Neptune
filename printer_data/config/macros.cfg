[gcode_macro PREHEAT_PLA]
gcode:
    M140 S60 ; Set bed temp
    M104 S200 ; Set extruder temp

[gcode_macro PREHEAT_PETG]
gcode:
    M140 S70 ; Set bed temp
    M104 S215 ; Set extruder temp

[gcode_macro PREHEAT_BED]
gcode:
    M140 S70 ; Set bed temp

[gcode_macro CENTER]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                        ; Home if needed
    {% endif %}
    G90                            ; Absolute positioning
    G0 X{110} Y{110} Z50 F6000  ; Move to center and raise Z

[gcode_macro ZOFFSET]
gcode:
    M140 S70 ; Set bed temp
    G28;
    PROBE_CALIBRATE ;  

[gcode_macro LEVEL]
gcode:
    M140 S70 ; Set bed temp
    G28;
    BED_SCREWS_ADJUST ; 

